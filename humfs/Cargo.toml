[package]
name = "runuz-hive"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "runuz hive — a standalone remote forager hive for the thrum protocol. Advertises humfs_read / humfs_do_code / humfs_do_noncode and shells out to the runuz CLI for filesystem ops. No hum internals; drop-in remote hive for humd."

[dependencies]
runuz = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
async-trait = "0.1"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
parking_lot = "0.12"

[[bin]]
name = "runuz-hive"
path = "src/main.rs"
