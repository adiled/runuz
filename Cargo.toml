[package]
name = "runuz"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "runuz — a standalone filesystem tool: do_code / do_nocode / do_read for any project on Earth. AST-grounded via tree-sitter; no hum dependencies."
repository = "https://github.com/adiled/runuz"
homepage = "https://github.com/adiled/runuz"
documentation = "https://github.com/adiled/runuz#readme"
readme = "README.md"
keywords = ["filesystem", "tree-sitter", "ast", "cli", "tools"]
categories = ["command-line-interface", "development-tools"]
exclude = ["hive/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
base64 = "0.22"
mime_guess = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# AST infra — tree-sitter parsers per language (same family humfs pins).
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"

[[bin]]
name = "runuz"
path = "src/main.rs"
