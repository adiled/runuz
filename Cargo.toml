[package]
name = "runuz"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Headless AST-based coding and semantic prose editing agent."
repository = "https://github.com/adiled/runuz"
homepage = "https://github.com/adiled/runuz"
documentation = "https://github.com/adiled/runuz#readme"
readme = "README.md"
keywords = ["filesystem", "tree-sitter", "ast", "cli", "tools"]
categories = ["command-line-interface", "development-tools"]
exclude = ["hive/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
base64 = "0.22"
libc = "0.2"
mime_guess = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "runuz"
path = "src/main.rs"
